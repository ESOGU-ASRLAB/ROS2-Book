# Liste 23 - Denetleyici yapılandırması (ros2_control).
# Bu dosya Bölüm 4'te yapıyı göstermek içindir. Aynı yapılandırmanın
# sahte donanım ve Gazebo ile çalıştırılması Bölüm 5 paketindedir:
#   ch05_simulation_visualization/config/controllers.yaml
controller_manager:
  ros__parameters:
    update_rate: 100        # Hz - denetim döngüsünün frekansı
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
